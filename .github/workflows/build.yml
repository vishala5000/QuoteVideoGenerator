name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "build.dir=${{ github.workspace }}/build" >> local.properties
    
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon
    
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
    
    - name: Run tests
      run: ./gradlew test
    
    - name: Generate Dependencies Report
      run: ./gradlew dependencies > dependencies.txt
    
    - name: Upload Dependencies Report
      uses: actions/upload-artifact@v4
      with:
        name: dependencies-report
        path: dependencies.txt
    
    - name: Check Lint
      run: ./gradlew lint
    
    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: app/build/reports/lint-results.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: app-release
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: app-release.apk
        name: Release ${{ github.ref_name }}
        body: |
          ## Quote Video Generator
          Version: ${{ github.ref_name }}
          
          ### Features:
          - Generate videos from quotes
          - Custom font support
          - Background music
          - ZIP file output
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
